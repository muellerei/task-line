<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="task-line: one clean line per task list above the Claude Code prompt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/></pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="0" fill="url(#dots)"/>
  <rect x="160" y="56" width="960" height="244" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="194" y="110" class="mono" font-size="25" font-weight="700" text-anchor="middle" fill="#f0883e">●</text>
  <text x="222" y="110" class="mono" font-size="22" fill="#e6edf3">Write the tests</text>
  <rect x="450" y="99" width="300" height="6" rx="3" fill="#30363d"/>
  <rect x="450" y="99" width="120" height="6" rx="3" fill="#f0883e"/>
  <text x="773" y="109" class="mono" font-size="20" fill="#e6edf3">2/5</text>
  <text x="826" y="109" class="mono" font-size="20" fill="#8b949e">40%</text>
  <text x="900" y="109" class="mono" font-size="17" fill="#f0883e"></text>
  <text x="194" y="160" class="mono" font-size="25" font-weight="700" text-anchor="middle" fill="#e3b341">?</text>
  <text x="222" y="160" class="mono" font-size="22" fill="#e6edf3">Ship it</text>
  <rect x="450" y="149" width="300" height="6" rx="3" fill="#30363d"/>
  <rect x="450" y="149" width="120" height="6" rx="3" fill="#e3b341"/>
  <text x="773" y="159" class="mono" font-size="20" fill="#e6edf3">2/5</text>
  <text x="826" y="159" class="mono" font-size="20" fill="#8b949e">40%</text>
  <text x="900" y="159" class="mono" font-size="17" fill="#e3b341">needs you</text>
  <text x="194" y="210" class="mono" font-size="25" font-weight="700" text-anchor="middle" fill="#f85149">✕</text>
  <text x="222" y="210" class="mono" font-size="22" fill="#e6edf3">Fix the build</text>
  <rect x="450" y="199" width="300" height="6" rx="3" fill="#30363d"/>
  <rect x="450" y="199" width="120" height="6" rx="3" fill="#f85149"/>
  <text x="773" y="209" class="mono" font-size="20" fill="#e6edf3">2/5</text>
  <text x="826" y="209" class="mono" font-size="20" fill="#8b949e">40%</text>
  <text x="900" y="209" class="mono" font-size="17" fill="#f85149">npm test failed</text>
  <text x="194" y="260" class="mono" font-size="25" font-weight="700" text-anchor="middle" fill="#3fb950">✓</text>
  <text x="222" y="260" class="mono" font-size="22" fill="#e6edf3">Done</text>
  <rect x="450" y="249" width="300" height="6" rx="3" fill="#30363d"/>
  <rect x="450" y="249" width="300" height="6" rx="3" fill="#3fb950"/>
  <text x="773" y="259" class="mono" font-size="20" fill="#e6edf3">5/5</text>
  <text x="826" y="259" class="mono" font-size="20" fill="#8b949e">100%</text>
  <text x="900" y="259" class="mono" font-size="17" fill="#3fb950"></text>
  <text x="640" y="418" text-anchor="middle" class="mono" font-size="96" font-weight="700" fill="#e6edf3" letter-spacing="-2">task<tspan fill="#f0883e">-</tspan>line</text>
  <text x="640" y="484" text-anchor="middle" class="sans" font-size="36" fill="#c9d1d9">One clean line per task list</text>
  <text x="640" y="536" text-anchor="middle" class="sans" font-size="26" fill="#8b949e">above the Claude Code prompt · filled from Claude's own todo tools</text>
</svg>
