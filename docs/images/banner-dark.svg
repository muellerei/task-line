<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="task-line: one clean line per task list above the Claude Code prompt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/></pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <rect x="48" y="44" width="700" height="232" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="78" y="92" class="mono" font-size="22" font-weight="700" text-anchor="middle" fill="#f0883e">●</text>
  <text x="102" y="92" class="mono" font-size="19" fill="#e6edf3">Write the tests</text>
  <rect x="288" y="82" width="150" height="6" rx="3" fill="#30363d"/>
  <rect x="288" y="82" width="60" height="6" rx="3" fill="#f0883e"/>
  <text x="458" y="91" class="mono" font-size="17" fill="#e6edf3">2/5</text>
  <text x="504" y="91" class="mono" font-size="17" fill="#8b949e">40%</text>
  <text x="568" y="91" class="mono" font-size="15" fill="#f0883e"></text>
  <text x="78" y="142" class="mono" font-size="22" font-weight="700" text-anchor="middle" fill="#e3b341">?</text>
  <text x="102" y="142" class="mono" font-size="19" fill="#e6edf3">Ship it</text>
  <rect x="288" y="132" width="150" height="6" rx="3" fill="#30363d"/>
  <rect x="288" y="132" width="60" height="6" rx="3" fill="#e3b341"/>
  <text x="458" y="141" class="mono" font-size="17" fill="#e6edf3">2/5</text>
  <text x="504" y="141" class="mono" font-size="17" fill="#8b949e">40%</text>
  <text x="568" y="141" class="mono" font-size="15" fill="#e3b341">needs you</text>
  <text x="78" y="192" class="mono" font-size="22" font-weight="700" text-anchor="middle" fill="#f85149">✕</text>
  <text x="102" y="192" class="mono" font-size="19" fill="#e6edf3">Fix the build</text>
  <rect x="288" y="182" width="150" height="6" rx="3" fill="#30363d"/>
  <rect x="288" y="182" width="60" height="6" rx="3" fill="#f85149"/>
  <text x="458" y="191" class="mono" font-size="17" fill="#e6edf3">2/5</text>
  <text x="504" y="191" class="mono" font-size="17" fill="#8b949e">40%</text>
  <text x="568" y="191" class="mono" font-size="15" fill="#f85149">npm test failed</text>
  <text x="78" y="242" class="mono" font-size="22" font-weight="700" text-anchor="middle" fill="#3fb950">✓</text>
  <text x="102" y="242" class="mono" font-size="19" fill="#e6edf3">Done</text>
  <rect x="288" y="232" width="150" height="6" rx="3" fill="#30363d"/>
  <rect x="288" y="232" width="150" height="6" rx="3" fill="#3fb950"/>
  <text x="458" y="241" class="mono" font-size="17" fill="#e6edf3">5/5</text>
  <text x="504" y="241" class="mono" font-size="17" fill="#8b949e">100%</text>
  <text x="568" y="241" class="mono" font-size="15" fill="#3fb950"></text>
  <text x="800" y="160" class="mono" font-size="68" font-weight="700" fill="#e6edf3" letter-spacing="-2">task<tspan fill="#f0883e">-</tspan>line</text>
  <text x="804" y="204" class="sans" font-size="26" fill="#c9d1d9">One clean line per task list</text>
  <text x="804" y="240" class="sans" font-size="19" fill="#8b949e">above the Claude Code prompt</text>
</svg>
